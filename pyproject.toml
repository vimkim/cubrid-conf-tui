[project]
name = "cubrid-conf-tui"
version = "0.1.0"
description = "Safely edit existing CUBRID common configuration in a terminal"
requires-python = ">=3.11"
dependencies = ["textual>=6,<7", "pyelftools>=0.32,<0.33"]

[project.scripts]
cubrid-conf-tui = "cubrid_conf_tui.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "mypy>=1.18", "ruff>=0.13"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
